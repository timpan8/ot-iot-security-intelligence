# CI – lint, typkontroll, enhetstester, datavalidering, bygge och röktest.
# GITHUB_TOKEN har minsta möjliga behörighet (endast läsning av repo-innehåll).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress är avstängt: med flera jobb i kedja (needs) kunde GitHub avbryta den egna
# körningen ("higher priority waiting request") när nästa jobb köades.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck, test, data, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Import workbook, normalize and validate public data
        run: |
          npm run data:import
          npm run data:build
          npm run data:validate
      - name: Build (prebuild validates data, postbuild checks artifact for private fields)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Upload dist for e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright röktest
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Kräver att "Dependency graph" är aktiverat under Settings → Advanced Security.
    # Tills dess rapporteras jobbet men blockerar inte PR:n.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
